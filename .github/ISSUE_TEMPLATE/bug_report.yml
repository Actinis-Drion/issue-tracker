name: Bug report
description: Drion crashed, failed to install or update, or did something wrong.
labels: ["triage"]
body:
  - type: markdown
    attributes:
      value: |
        **This tracker is public.** Everything you write or attach here can be read by anyone.

        The quickest way to file a report is **Report a problem** in the Drion launcher: it fills in the version and system fields below.

        Do not post passwords, account names, phone numbers or other personal data. Keep diagnostic archives and logs out of public issues and Telegram. Email small files to contact@actinis.io and mention the issue number. For larger files, upload them to Google Drive or a similar service, restrict access to contact@actinis.io, and email the link with the issue number.

        One problem per report, please. Check the [known issues](https://github.com/Actinis-Drion/issue-tracker/issues?q=is%3Aissue+is%3Apinned) first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did before it happened. Say whether it happens every time.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. ...
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux desktop (Flatpak)
        - Ubuntu Touch
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Drion version and build
      description: Settings → About → Version. On the desktop, the Copy button copies this line.
      placeholder: Drion 2026.11.20.1 (alpha), build 2026.11.20.1+0123abcd4
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: System
      description: Distribution and version, or phone model and Ubuntu Touch version; desktop session; GPU. Report a problem fills this in.
      placeholder: |
        Distribution or device:
        Desktop session:
        GPU:
  - type: input
    id: app
    attributes:
      label: Android app involved
      description: The app's name and version, if the problem happened in an app.
  - type: textarea
    id: logs
    attributes:
      label: Screenshots and diagnostic handoff
      description: Optional screenshots are public. Check them for personal data before attaching them. To collect diagnostics for email, use Create diagnostic archive in the launcher's sidebar (desktop) or Settings → Diagnostic archive (Ubuntu Touch).
  - type: checkboxes
    id: public-ack
    attributes:
      label: Before you submit
      options:
        - label: I understand that this report and its attachments are public, and I checked them for personal data.
          required: true
